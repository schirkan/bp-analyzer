name: Release

# Builds the self-contained single-file executable and publishes it as a
# GitHub release. Triggered by pushing a version tag (v*).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish single-file exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # The runtime identifier has to be passed to restore AND build, otherwise
      # publish fails with NETSDK1047 ("Assets file doesn't have a target for
      # net8.0/win-x64").
      #
      # The publish profile must be given to the restore as well: without it the
      # restore does not pull the ILLink (trimming) assets, and the subsequent
      # publish with --no-restore silently skips trimming - the exe then weighs
      # ~35 MB instead of ~12.6 MB.
      - name: Restore
        run: dotnet restore BP-Analyzer.csproj -r win-x64 -p:PublishProfile=BP-Analyzer-win-x64

      - name: Build
        run: dotnet build BP-Analyzer.csproj -c Release -r win-x64 --no-restore

      - name: Publish single-file exe
        run: >
          dotnet publish BP-Analyzer.csproj
          -c Release
          -r win-x64
          --no-restore
          -p:PublishProfile=BP-Analyzer-win-x64
          -o publish

      - name: Rename asset
        run: Rename-Item publish/BP-Analyzer.exe BP-Analyzer-win-x64.exe

      # Guards against silently losing the trimming: without the ILLink assets
      # the exe weighs ~35 MB instead of ~12.6 MB.
      - name: Check binary size
        shell: pwsh
        run: |
          $size = (Get-Item publish/BP-Analyzer-win-x64.exe).Length
          $mb = [math]::Round($size / 1MB, 1)
          Write-Host "binary size: $mb MB"
          if ($size -gt 20MB) { throw "binary is $mb MB - trimming was probably skipped (expected ~12.6 MB)" }

      - name: Compute checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/BP-Analyzer-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BP-Analyzer-win-x64.exe" | Out-File -FilePath publish/checksums.txt -Encoding utf8
          $hash

      # The release body is kept in the repository so that it stays in sync
      # with the actual behavior of the tool.
      - name: Compose release notes
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/BP-Analyzer-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          $body = Get-Content RELEASE_NOTES.md -Raw
          $body = $body -replace '<sha256>', $hash
          $body | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --repo ${{ github.repository }} `
            --title "BP-Analyzer ${{ github.ref_name }}" `
            --notes-file release-notes.md `
            "publish/BP-Analyzer-win-x64.exe#BP-Analyzer-win-x64.exe" `
            "publish/checksums.txt#SHA256 checksum"

      - name: Upload artifact to workflow run
        uses: actions/upload-artifact@v5
        with:
          name: BP-Analyzer-win-x64
          path: publish/BP-Analyzer-win-x64.exe
          if-no-files-found: error
