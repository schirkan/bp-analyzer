name: CI

# Build check for every push and pull request.
# Uses the same runtime identifier as the release workflow so that the
# RID-specific restore path is covered here as well.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # restore AND build need the runtime identifier, otherwise publish
      # fails with NETSDK1047. The publish profile must be part of the restore
      # too, otherwise the trimming assets are missing and publish silently
      # skips trimming (35 MB instead of 12.6 MB).
      - name: Restore
        run: dotnet restore BP-Analyzer.csproj -r win-x64 -p:PublishProfile=BP-Analyzer-win-x64

      - name: Build
        run: dotnet build BP-Analyzer.csproj -c Release -r win-x64 --no-restore

      - name: Publish (smoke test the single-file output)
        run: >
          dotnet publish BP-Analyzer.csproj
          -c Release
          -r win-x64
          --no-restore
          -p:PublishProfile=BP-Analyzer-win-x64
          -o publish

      - name: Rename asset
        run: Rename-Item publish/BP-Analyzer.exe BP-Analyzer-win-x64.exe

      # Proves that the executable works without the templates folder next to it.
      - name: Smoke test the single-file exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/BP-Analyzer.exe).Path
          & $exe help
          if ($LASTEXITCODE -ne 0) { throw "help failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path ci-out | Out-Null
          & $exe codegen --xml=xml --output=ci-out/code
          if ($LASTEXITCODE -ne 0) { throw "codegen failed with exit code $LASTEXITCODE" }
          & $exe analyze --code=ci-out/code --output=ci-out/sdd
          if ($LASTEXITCODE -ne 0) { throw "analyze failed with exit code $LASTEXITCODE" }
          $files = (Get-ChildItem ci-out -Recurse -File).Count
          Write-Host "generated files: $files"
          if ($files -lt 10) { throw "unexpectedly few output files: $files" }

      # Makes the built binary downloadable from the workflow run.
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: BP-Analyzer-win-x64
          path: publish/BP-Analyzer-win-x64.exe
          if-no-files-found: error
